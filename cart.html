<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding:20px;
            text-align:center;
        }

        .cart-item{
            border:1px solid #ddd;
            padding:15px;
            margin:10px auto;
            width:300px;
            border-radius:10px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:8px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>
<body>

    <h1>My Cart</h1>

    <div id="cart-items"></div>

    <a href="index.html">
        <button>Back to Store</button>
    </a>

    <script>
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartDiv = document.getElementById("cart-items");

        if(cart.length === 0){
            cartDiv.innerHTML = "<h3>Your cart is empty</h3>";
        }else{
            cart.forEach(item => {
                cartDiv.innerHTML += `
                    <div class="cart-item">
                        <h3>${item.name}</h3>
                        <p>₹${item.price}</p>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
